<svg width="2000" height="920" viewBox="0 0 2000 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .display { font-family: "Fraunces", Georgia, serif; fill: #0A2242; }
      .sans { font-family: "Newsreader", Georgia, serif; fill: #4D5360; font-weight: 500; }
      .eyebrow { font-family: "IBM Plex Mono", monospace; fill: #7A7264; letter-spacing: 3px; }
    </style>
  
  </defs>
  <rect width="2000" height="920" fill="#F6F1E8"/>
  <text x="1000" y="84" text-anchor="middle" class="display" font-size="48" font-weight="bold">The Tools Behind the Progression</text>
  <text x="1000" y="122" text-anchor="middle" class="sans" font-size="21">Five classes of AI systems</text>
  <text x="1000" y="162" text-anchor="middle" class="sans" font-size="18" font-style="italic" fill="#0A2242">The tool follows the maturity of the practice, never the other way around.</text>
  <rect x="240" y="236" width="32" height="4" fill="#677C99"/><text x="256" y="272" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">PHASES 1–2 · ASK &amp; UNDERSTAND</text><text x="256" y="314" text-anchor="middle" class="display" font-size="31" font-weight="bold">Chatbot</text><text x="256" y="382" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT IT IS</text><text x="256" y="410" text-anchor="middle" class="sans" font-size="16" fill="#242A31">A conversation with a model.</text><text x="256" y="478" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">EXAMPLE</text><text x="256" y="506" text-anchor="middle" class="sans" font-size="16" fill="#242A31">ChatGPT, Claude, or Gemini</text><text x="256" y="528" text-anchor="middle" class="sans" font-size="16" fill="#242A31">in a chat window</text><text x="256" y="576" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT YOU DO</text><text x="256" y="604" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Ask, probe, compare,</text><text x="256" y="626" text-anchor="middle" class="sans" font-size="16" fill="#242A31">and verify.</text><text x="256" y="672" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold" style="fill:#D82032">WHAT PERSISTS</text><text x="256" y="706" text-anchor="middle" class="display" font-size="21" font-weight="bold">Your own understanding</text><rect x="612" y="236" width="32" height="4" fill="#4E6485"/><text x="628" y="272" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">PHASES 3–4 · PRODUCE &amp; JUDGE</text><text x="628" y="314" text-anchor="middle" class="display" font-size="31" font-weight="bold">Agent</text><text x="628" y="382" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT IT IS</text><text x="628" y="410" text-anchor="middle" class="sans" font-size="16" fill="#242A31">A system that acts: it reads files,</text><text x="628" y="432" text-anchor="middle" class="sans" font-size="16" fill="#242A31">uses tools, and produces work.</text><text x="628" y="478" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">EXAMPLE</text><text x="628" y="506" text-anchor="middle" class="sans" font-size="16" fill="#242A31">A coding or research agent:</text><text x="628" y="528" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Claude Code, Codex, deep research</text><text x="628" y="576" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT YOU DO</text><text x="628" y="604" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Delegate a bounded task,</text><text x="628" y="626" text-anchor="middle" class="sans" font-size="16" fill="#242A31">then review and revise.</text><text x="628" y="672" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold" style="fill:#D82032">WHAT PERSISTS</text><text x="628" y="706" text-anchor="middle" class="display" font-size="21" font-weight="bold">The work product</text><rect x="984" y="236" width="32" height="4" fill="#22395C"/><text x="1000" y="272" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">PHASE 5 · CODIFY</text><text x="1000" y="314" text-anchor="middle" class="display" font-size="31" font-weight="bold">Skill</text><text x="1000" y="382" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT IT IS</text><text x="1000" y="410" text-anchor="middle" class="sans" font-size="16" fill="#242A31">A method written down so</text><text x="1000" y="432" text-anchor="middle" class="sans" font-size="16" fill="#242A31">an agent can follow it.</text><text x="1000" y="478" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">EXAMPLE</text><text x="1000" y="506" text-anchor="middle" class="sans" font-size="16" fill="#242A31">A brief-writing or source-check</text><text x="1000" y="528" text-anchor="middle" class="sans" font-size="16" fill="#242A31">skill an agent loads on demand</text><text x="1000" y="576" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT YOU DO</text><text x="1000" y="604" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Codify a method once;</text><text x="1000" y="626" text-anchor="middle" class="sans" font-size="16" fill="#242A31">reuse and share it.</text><text x="1000" y="672" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold" style="fill:#D82032">WHAT PERSISTS</text><text x="1000" y="706" text-anchor="middle" class="display" font-size="21" font-weight="bold">The method</text><rect x="1356" y="236" width="32" height="4" fill="#0A2242"/><text x="1372" y="272" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">PHASE 6 · SUPERVISE</text><text x="1372" y="314" text-anchor="middle" class="display" font-size="31" font-weight="bold">Agent team</text><text x="1372" y="382" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT IT IS</text><text x="1372" y="410" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Agents with roles, handoffs,</text><text x="1372" y="432" text-anchor="middle" class="sans" font-size="16" fill="#242A31">and a review structure.</text><text x="1372" y="478" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">EXAMPLE</text><text x="1372" y="506" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Agents coordinated by a harness:</text><text x="1372" y="528" text-anchor="middle" class="sans" font-size="16" fill="#242A31">one drafts, one checks, one edits</text><text x="1372" y="576" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT YOU DO</text><text x="1372" y="604" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Brief, monitor, escalate,</text><text x="1372" y="626" text-anchor="middle" class="sans" font-size="16" fill="#242A31">and integrate results.</text><text x="1372" y="672" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold" style="fill:#D82032">WHAT PERSISTS</text><text x="1372" y="706" text-anchor="middle" class="display" font-size="21" font-weight="bold">The harness</text><rect x="1728" y="236" width="32" height="4" fill="#0A2242"/><text x="1744" y="272" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold" style="fill:#D82032">THE INSTITUTIONAL PEAK</text><text x="1744" y="314" text-anchor="middle" class="display" font-size="31" font-weight="bold">Knowledge layer</text><text x="1744" y="342" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold" style="fill:#D82032">BEYOND THE GOVERNANCE GATE</text><text x="1744" y="382" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT IT IS</text><text x="1744" y="410" text-anchor="middle" class="sans" font-size="16" fill="#242A31">The institution’s validated knowledge</text><text x="1744" y="432" text-anchor="middle" class="sans" font-size="16" fill="#242A31">and the infrastructure to apply it.</text><text x="1744" y="478" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">EXAMPLE</text><text x="1744" y="506" text-anchor="middle" class="sans" font-size="16" fill="#242A31">A governed knowledge base powering</text><text x="1744" y="528" text-anchor="middle" class="sans" font-size="16" fill="#242A31">custom or domain-specific models</text><text x="1744" y="576" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold">WHAT YOU DO</text><text x="1744" y="604" text-anchor="middle" class="sans" font-size="16" fill="#242A31">Govern it: validate, evaluate,</text><text x="1744" y="626" text-anchor="middle" class="sans" font-size="16" fill="#242A31">control access, audit.</text><text x="1744" y="672" text-anchor="middle" class="eyebrow" font-size="12" font-weight="bold" style="fill:#D82032">WHAT PERSISTS</text><text x="1744" y="706" text-anchor="middle" class="display" font-size="21" font-weight="bold">The compounded knowledge</text><line x1="442" y1="240" x2="442" y2="718" stroke="#DED6C8" stroke-width="1.5"/><line x1="814" y1="240" x2="814" y2="718" stroke="#DED6C8" stroke-width="1.5"/><line x1="1186" y1="240" x2="1186" y2="718" stroke="#DED6C8" stroke-width="1.5"/><line x1="1558" y1="240" x2="1558" y2="718" stroke="#DED6C8" stroke-width="1.5"/><rect x="256" y="744.5" width="30" height="3" style="fill:#D82032"/><line x1="296" y1="746" x2="1720" y2="746" stroke="#918D89" stroke-width="1.5"/><path d="M 1720 746 l -12 -6 l 0 12 z" fill="#918D89"/>
  <text x="1000" y="838" text-anchor="middle" class="display" font-size="23" font-weight="bold">Each step up leaves behind a more durable asset. That is why capability compounds.</text>
  <text x="1000" y="872" text-anchor="middle" class="sans" font-size="16" font-style="italic">The classic failure is tool-first thinking: using an agent where a checklist would do.</text>
</svg>